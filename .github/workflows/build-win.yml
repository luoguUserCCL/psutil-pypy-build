name: Build psutil >=7 for PyPy 3.11 (Windows MSVC)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and setup PyPy 3.11
        shell: pwsh
        run: |
          $url = "https://downloads.python.org/pypy/pypy3.11-v7.3.23-win64.zip"
          $zip = "pypy3.11.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath .
          Rename-Item -Path "pypy3.11-v7.3.23-win64" -NewName "pypy3.11"
          $pypyDir = Resolve-Path "pypy3.11"
          echo "PYPY_DIR=$pypyDir" >> $env:GITHUB_ENV

      - name: Ensure pip
        shell: cmd
        run: |
          "%PYPY_DIR%\python.exe" -m ensurepip --upgrade
          "%PYPY_DIR%\python.exe" -m pip install wheel

      - name: Download psutil 7.2.2 source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.pythonhosted.org/packages/source/p/psutil/psutil-7.2.2.tar.gz" -OutFile "psutil-7.2.2.tar.gz"
          tar -xzf "psutil-7.2.2.tar.gz"

      - name: Patch setup.py with Python
        shell: cmd
        run: |
          "%PYPY_DIR%\python.exe" -c "import re; f=open('psutil-7.2.2/setup.py','r'); c=f.read(); f.close(); c=re.sub(r'def get_long_description\(\):.*?(?=^def |\Z)', 'def get_long_description():\n    readme = os.path.join(HERE, \"README.rst\")\n    if os.path.exists(readme):\n        with open(readme, \"r\", encoding=\"utf-8\") as f:\n            return f.read()\n    return \"\"\n\n', c, flags=re.DOTALL); f=open('psutil-7.2.2/setup.py','w'); f.write(c); f.close(); print('Patched')"

      - name: Build wheel
        shell: cmd
        run: |
          cd psutil-7.2.2
          "%PYPY_DIR%\python.exe" setup.py bdist_wheel
          cd ..
          copy psutil-7.2.2\dist\*.whl .

      - name: Verify
        shell: cmd
        run: |
          for %%f in (*.whl) do (
            "%PYPY_DIR%\python.exe" -m pip install %%f
            "%PYPY_DIR%\python.exe" -c "import psutil; print('OK:', psutil.__version__, psutil.cpu_count())"
            goto :done
          )
          :done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psutil7-pypy311-win
          path: "*.whl"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: psutil-7.2.2-pypy3.11-win
          name: "psutil 7.2.2 for PyPy 3.11 v7.3.23 (Windows)"
          files: "*.whl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
