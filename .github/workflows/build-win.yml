name: Build psutil 7.2.2 for PyPy 3.11 (Windows MSVC)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PyPy 3.11
        shell: cmd
        run: |
          curl -s "https://downloads.python.org/pypy/pypy3.11-v7.3.23-win64.zip" -o "pypy.zip"
          7z x "pypy.zip"
          ren "pypy3.11-v7.3.23-win64" "pypy3.11"

      - name: Download psutil release-7.2.2 from GitHub
        shell: cmd
        run: |
          curl -s -L -H "Authorization: token %GITHUB_TOKEN%" "https://github.com/giampaolo/psutil/archive/refs/tags/release-7.2.2.zip" -o "psutil.zip"
          7z x "psutil.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheel
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALLDIR=%%i
          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          set INCLUDE=%CD%\pypy3.11\include;%INCLUDE%
          set LIB=%CD%\pypy3.11\libs;%LIB%
          set PATH=%CD%\pypy3.11;%CD%\pypy3.11\Scripts;%PATH%
          set DISTUTILS_USE_SDK=1

          pypy3.11 -m ensurepip
          if errorlevel 1 exit /b 1
          pypy3.11 -m pip install --upgrade setuptools wheel
          if errorlevel 1 exit /b 1

          cd psutil-release-7.2.2
          pypy3.11 setup.py bdist_wheel
          if errorlevel 1 exit /b 1
          copy dist\*.whl ..\
          cd ..

      - name: Verify
        shell: cmd
        run: |
          set PATH=%CD%\pypy3.11;%CD%\pypy3.11\Scripts;%PATH%
          for %%f in (*.whl) do (
            pypy3.11 -m pip install %%f
            pypy3.11 -c "import psutil; print('OK:', psutil.__version__, psutil.cpu_count())"
            goto :done
          )
          :done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psutil-7.2.2-pypy311-win
          path: "*.whl"

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: psutil-7.2.2-pypy3.11-win
          name: "psutil 7.2.2 for PyPy 3.11 v7.3.23 (Windows)"
          files: "*.whl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
