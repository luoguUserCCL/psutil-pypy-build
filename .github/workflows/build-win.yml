name: Build psutil 7.2.2 for PyPy 3.11 (Windows MSVC)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PyPy 3.11
        shell: cmd
        run: |
          curl -s "https://downloads.python.org/pypy/pypy3.11-v7.3.23-win64.zip" -o "pypy.zip"
          7z x "pypy.zip"
          ren "pypy3.11-v7.3.23-win64" "pypy3.11"

      - name: Download psutil release-7.2.2 from GitHub
        shell: cmd
        run: |
          curl -s -L -H "Authorization: token %GITHUB_TOKEN%" "https://github.com/giampaolo/psutil/archive/refs/tags/release-7.2.2.zip" -o "psutil.zip"
          7z x "psutil.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheel (with MSVC checks)
        shell: cmd
        run: |
          echo ==== vswhere output ====
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath || echo "vswhere: no matching VS with VC tools"
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALLDIR=%%i
          echo VSINSTALLDIR=%VSINSTALLDIR%

          if not defined VSINSTALLDIR (
            echo ERROR: VS with VC tools not found. Ensure runner has Visual C++ workload installed.
            exit /b 1
          )

          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64 || (echo ERROR: vcvarsall failed & exit /b 1)

          echo ==== after vcvarsall: where cl ====
          where cl || (echo ERROR: cl.exe not found in PATH after vcvarsall & exit /b 1)
          echo ==== PATH (truncated) ====
          echo %PATH:~0,400%

          echo ==== check MSVC dir under VSINSTALLDIR ====
          dir "%VSINSTALLDIR%\VC\Tools\MSVC" /b || echo "no MSVC dir"

          echo ==== try recursive find cl.exe under VSINSTALLDIR ====
          where /R "%VSINSTALLDIR%" cl.exe || echo "cl.exe not found under VSINSTALLDIR"

          set DISTUTILS_USE_SDK=1
          set INCLUDE=%CD%\pypy3.11\include;%INCLUDE%
          set LIB=%CD%\pypy3.11\libs;%LIB%
          set PATH=%CD%\pypy3.11;%CD%\pypy3.11\Scripts;%PATH%

          pypy3.11 -m ensurepip || exit /b 1
          pypy3.11 -m pip install --upgrade setuptools wheel || exit /b 1

          cd psutil-release-7.2.2
          pypy3.11 setup.py bdist_wheel || exit /b 1
          copy dist\*.whl ..\
          cd ..

      - name: Verify
        shell: cmd
        run: |
          set PATH=%CD%\pypy3.11;%CD%\pypy3.11\Scripts;%PATH%
          for %%f in (*.whl) do (
            pypy3.11 -m pip install %%f
            pypy3.11 -c "import psutil; print('OK:', psutil.__version__, psutil.cpu_count())"
            goto :done
          )
          :done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psutil-7.2.2-pypy311-win
          path: "*.whl"

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: psutil-7.2.2-pypy3.11-win
          name: "psutil 7.2.2 for PyPy 3.11 v7.3.23 (Windows)"
          files: "*.whl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
